name: Update Tigo Guide

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      # Playwrightのブラウザ保存先をキャッシュできるように固定
      PLAYWRIGHT_BROWSERS_PATH: /home/runner/.cache/ms-playwright
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: /home/runner/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-v1.48

      - name: Install deps (no apt)
        run: |
          pip install --no-input -q -r requirements.txt
          # --with-deps を付けない！フォントの apt install 25.9MBをスキップ
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" != 'true' ]; then
            playwright install chromium
          fi

      - name: Download sources
        run: python scripts/download.py

      - name: Parse
        run: python scripts/scrape.py

      - name: Commit
        run: |
          git config user.name "bot"
          git config user.email "bot@github"
          git add docs/raw/ docs/data.json
          git diff --staged --quiet || (git commit -m "update" && git push)
