name: Actualizar Programación Tigo Sports

concurrency:
  group: tigo-pages
  cancel-in-progress: false

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          mkdir -p docs/data

      - name: Run scraper
        run: python scripts/scraper.py

      - name: Commit y push (resolucion automatica de conflictos)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add docs/programacion.json docs/data/
          
          if git diff --staged --quiet; then
            echo "No hay cambios"
            exit 0
          fi
          
          git commit -m "chore: actualizar programacion $(date -u +%Y-%m-%dT%H:%M:00Z)"
          
          # 1. まずrebaseを試す
          echo "Intentando pull --rebase..."
          if git pull --rebase origin main; then
            echo "Rebase exitoso"
          else
            echo "Conflicto en rebase, resolviendo con datos locales..."
            git rebase --abort || true
            
            # 2. rebase失敗時は、ローカルのJSONを優先してマージ
            # ours = 今作った新しい番組表を優先
            git fetch origin main
            git merge origin/main --no-edit -X ours || {
              # それでもダメなら強制的にoursで解決
              echo "Resolviendo conflictos manualmente..."
              git checkout --ours -- docs/programacion.json docs/data/index.json || true
              git checkout --theirs -- docs/data/2026-*.json || true
              # 新しく生成したファイルを優先
              python scripts/scraper.py
              git add docs/programacion.json docs/data/
              git commit --no-edit || true
            }
          fi
          
          git push origin main
          echo "Push exitoso!"
