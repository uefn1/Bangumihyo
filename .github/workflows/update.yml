name: AI EPG - No API Key
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      
      - name: Install Ollama (無料ローカルAI)
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve &
          sleep 5
          ollama pull phi3:mini
          # 1.6GBの小型モデル、GitHub Actionsの無料枠で動く
      
      - name: Python準備
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      
      - name: 依存関係
        run: pip install requests beautifulsoup4

      - name: AIが番組表を生成 (APIキー無し)
        run: python scripts/ai_generator_local.py

      - name: Commit to Pages
        run: |
          git config user.name "ai-bot"
          git config user.email "ai-bot@github"
          git add docs/
          git diff --staged --quiet || git commit -m "AI EPG $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]"
          git pull --rebase origin main || true
          git push origin main
