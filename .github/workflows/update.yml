name: Mirror 【entity-Tigo Sports¦canonical_name=Tigo Sports】 Oficial
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4 lxml
      - name: Descargar sitio oficial
        run: python scripts/scraper.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --staged --quiet || git commit -m "chore: mirror oficial $(date -u +%Y-%m-%dT%H:%M:00Z)"
          git pull --rebase origin main || git pull origin main --no-rebase -X ours
          git push origin main
