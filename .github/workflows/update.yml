name: Actualizar Programación Tigo Sports

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          mkdir -p docs

      - name: Run scraper
        run: python scripts/scraper.py

      - name: Commit si hay cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/programacion.json
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "chore: actualizar programacion $(date -u +%Y-%m-%dT%H:%M:00Z)"
            git push
          fi
