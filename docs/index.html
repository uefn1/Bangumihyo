<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>【entity-Tigo Sports¦canonical_name=TIGO SPORTS】 Paraguay - Programación Completa</title>
<style>
:root{--bg:#0a0e1a;--card:#1a2332;--card-hover:#1f2d42;--border:#23344f;--accent:#00a9e0;--text:#e6eefc;--muted:#8aa0c2;--live:#ff2d55;--success:#00c896}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}
.header{position:sticky;top:0;z-index:10;background:rgba(10,14,26,0.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:14px 18px}
.wrap{max-width:1200px;margin:0 auto;padding:18px}
.tabs{display:flex;gap:8px;overflow:auto}
.tab{white-space:nowrap;padding:8px 14px;border-radius:999px;border:1px solid var(--border);background:var(--card);color:var(--muted);cursor:pointer}
.tab.active{background:var(--accent);color:#00111a;font-weight:700}
.tz-bar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.card{border:1px solid var(--border);background:var(--card);border-radius:16px;padding:14px}
.mono{font-family:ui-monospace,Menlo,monospace}
.badge{font-size:10px;padding:2px 8px;border-radius:999px;background:var(--bg);border:1px solid var(--border)}
.live{background:var(--live);color:#fff;font-weight:700}
.shift{font-size:10px;font-weight:800;padding:2px 6px;border-radius:999px;color:#fff}
.shift.pos{background:var(--success)} .shift.neg{background:var(--live)}
.convert-box{background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:10px;margin-top:10px}
.search{width:100%;padding:10px 14px;border-radius:999px;border:1px solid var(--border);background:var(--card);color:var(--text)}
</style>
</head>
<body>
<div class="header">
  <div class="wrap" style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px">
    <div><strong style="color:var(--accent)">【entity-TIGO SPORTS¦canonical_name=TIGO SPORTS】</strong> Paraguay <span class="badge" id="count"></span></div>
    <div style="display:flex;gap:8px;align-items:center">
      <label style="font-size:12px"><input type="checkbox" id="dual" checked> Mostrar fecha + doble hora</label>
      <select id="tz-select" style="background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:999px;padding:6px 10px">
        <option value="America/Asuncion">PYT (Asunción) UTC-3</option>
        <option value="UTC">GMT/UTC</option>
        <option value="Asia/Tokyo" selected>JST (Tokyo) UTC+9</option>
        <option value="America/Argentina/Buenos_Aires">ART</option>
        <option value="America/New_York">EST</option>
      </select>
    </div>
  </div>
</div>

<div class="wrap">
  <div id="date-tabs" class="tabs"></div>
  <input id="search" class="search" placeholder="Buscar: Cerro, Olimpia...">
  <div id="grid" class="grid" style="margin-top:14px"></div>
</div>

<script>
const SOURCE_TZ='America/Asuncion';
function getOffsetMinutes(tz,date){
  try{
    const fmt=new Intl.DateTimeFormat('en-US',{timeZone:tz,timeZoneName:'shortOffset',hour:'2-digit'});
    const name=fmt.formatToParts(date).find(p=>p.type==='timeZoneName')?.value||'GMT+0';
    const m=name.match(/GMT([+-])(\d+)(?::(\d+))?/);
    if(!m) return 0;
    return (m[1]==='+'?1:-1)*(parseInt(m[2])*60+parseInt(m[3]||'0'));
  }catch{return 0}
}
function convertWithDate(hora_pyt,fecha_pyt,targetTZ){
  const [y,m,d]=fecha_pyt.split('-').map(Number);
  const [h,min]=hora_pyt.split(':').map(Number);
  const baseUTC=Date.UTC(y,m-1,d,h,min);
  const srcOff=getOffsetMinutes(SOURCE_TZ,new Date(baseUTC));
  const tgtOff=getOffsetMinutes(targetTZ,new Date(baseUTC));
  const diff=tgtOff-srcOff;
  let total=h*60+min+diff;
  let cur=new Date(y,m-1,d);
  let shift=0;
  while(total<0){total+=1440;cur.setDate(cur.getDate()-1);shift--;}
  while(total>=1440){total-=1440;cur.setDate(cur.getDate()+1);shift++;}
  const dateStr=`${cur.getFullYear()}-${String(cur.getMonth()+1).padStart(2,'0')}-${String(cur.getDate()).padStart(2,'0')}`;
  const timeStr=`${String(Math.floor(total/60)).padStart(2,'0')}:${String(total%60).padStart(2,'0')}`;
  return{original:`${fecha_pyt} ${hora_pyt}`,converted:`${dateStr} ${timeStr}`,fechaOriginal:fecha_pyt,horaOriginal:hora_pyt,fechaConvertida:dateStr,horaConvertida:timeStr,dayShift:shift,label:shift===0?'':shift>0?`(+${shift}d)`: `(${shift}d)`};
}

let allData=null,currentDate=null;
async function loadAll(){
  const r=await fetch('./programacion.json?v='+Date.now());
  allData=await r.json();
  const urlDate=new URLSearchParams(location.search).get('date');
  currentDate=urlDate&&allData.fechas_disponibles.includes(urlDate)?urlDate:allData.fechas_disponibles[0];
  renderTabs(); render();
}
function renderTabs(){
  document.getElementById('date-tabs').innerHTML=allData.fechas_disponibles.map(f=>{
    const d=new Date(f+'T12:00:00');
    const label=d.toLocaleDateString('es-PY',{weekday:'short',day:'numeric',month:'short'});
    const isToday=f===allData.fechas_disponibles[0];
    return `<button class="tab ${f===currentDate?'active':''}" onclick="switchDate('${f}')">${isToday?'Hoy ':''}${label}</button>`;
  }).join('');
}
function switchDate(f){currentDate=f;history.replaceState(null,'',`?date=${f}`);renderTabs();render();}
function render(){
  const tz=document.getElementById('tz-select').value;
  const dual=document.getElementById('dual').checked;
  const q=document.getElementById('search').value.toLowerCase();
  const day=allData.programacion_por_fecha[currentDate];
  let list=day.programacion;
  if(q) list=list.filter(p=>(p.titulo+' '+p.canal).toLowerCase().includes(q));
  document.getElementById('count').textContent=`${list.length} eventos - ${currentDate}`;
  document.getElementById('grid').innerHTML=list.map(p=>{
    const c=convertWithDate(p.hora_pyt,currentDate,tz);
    return `<div class="card">
      <div style="display:flex;justify-content:space-between"><span class="mono">${p.hora_pyt} PYT</span><span class="badge">${p.canal}</span></div>
      <div style="font-weight:600;margin:8px 0">${p.titulo}</div>
      <span class="badge">${p.categoria}</span> ${p.en_vivo?'<span class="badge live">EN VIVO</span>':''}
      <div class="convert-box">
        <div style="display:flex;justify-content:space-between;font-size:11px;color:#8aa0c2"><span>ORIGINAL</span><span class="mono">${c.fechaOriginal} ${c.horaOriginal} PYT</span></div>
        ${dual?`<div style="height:1px;background:#23344f;margin:6px 0"></div>
        <div style="display:flex;justify-content:space-between"><span style="font-size:11px;color:#00a9e0">→ ${tz} ${c.dayShift!==0?`<span class="shift ${c.dayShift>0?'pos':'neg'}">${c.label}</span>`:''}</span><span class="mono" style="font-weight:700">${c.fechaConvertida} ${c.horaConvertida}</span></div>
        ${c.dayShift!==0?`<div style="font-size:10px;color:#8aa0c2;margin-top:4px">Cruza medianoche: ${c.original} → ${c.converted}</div>`:''}`:''}
      </div>
    </div>`;
  }).join('');
}
document.getElementById('tz-select').addEventListener('change',render);
document.getElementById('dual').addEventListener('change',render);
document.getElementById('search').addEventListener('input',render);
loadAll();
</script>
</body>
</html>
