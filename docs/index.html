<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>【entity-Tigo Sports¦canonical_name=TIGO SPORTS】 Paraguay - Programación</title>
<style>
:root{--bg:#0a0e1a;--card:#141d2e;--card2:#1a2332;--border:#23344f;--accent:#00a9e0;--text:#e6eefc;--muted:#8aa0c2;--live:#ff2d55;--success:#00c896;--warn:#ffb020}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,sans-serif}
.header{position:sticky;top:0;z-index:20;background:rgba(10,14,26,0.92);backdrop-filter:blur(14px);border-bottom:1px solid var(--border)}
.wrap{max-width:1300px;margin:0 auto;padding:12px 16px}
.top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
.brand{font-weight:800;letter-spacing:.06em} .brand span{color:var(--accent)}
.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
select,input{border-radius:999px;border:1px solid var(--border);background:var(--card2);color:var(--text);padding:7px 12px;font-size:12px}
.search{width:260px}
.tabs{display:flex;gap:6px;overflow:auto;padding:10px 16px;border-bottom:1px solid var(--border);background:var(--bg)}
.tab{white-space:nowrap;padding:8px 14px;border-radius:999px;border:1px solid var(--border);background:var(--card2);color:var(--muted);cursor:pointer;font-size:12px}
.tab.active{background:var(--text);color:#000;font-weight:700;border-color:var(--text)}
.tab .hoy{background:var(--accent);color:#00111a;font-size:10px;padding:1px 6px;border-radius:999px;margin-left:6px;font-weight:800}
.epg{display:grid;grid-template-columns:70px 1fr 1fr;min-height:80vh}
.time-col{border-right:1px solid var(--border);background:var(--bg);position:sticky;left:0;z-index:5}
.time-slot{height:60px;border-bottom:1px dashed rgba(35,52,79,.6);font-size:11px;color:var(--muted);padding:4px 8px;text-align:right;font-family:ui-monospace,monospace}
.ch-header{position:sticky;top:0;z-index:10;background:var(--card);border-bottom:1px solid var(--border);padding:8px 12px;font-weight:700;font-size:12px;display:flex;justify-content:space-between}
.ch-col{border-right:1px solid var(--border);position:relative}
.program{position:absolute;left:6px;right:6px;border-radius:10px;border:1px solid var(--border);background:var(--card2);padding:8px 10px;overflow:hidden;cursor:pointer;transition:.15s}
.program:hover{transform:translateY(-1px);border-color:var(--accent);z-index:2}
.program.live{border-left:3px solid var(--live)}
.program .hora{font-family:ui-monospace,monospace;font-size:11px;font-weight:700;color:var(--text)}
.program .titulo{font-size:12px;font-weight:600;line-height:1.3;margin:3px 0;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.program .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.badge{font-size:9px;padding:2px 6px;border-radius:999px;background:var(--bg);border:1px solid var(--border);color:var(--muted)}
.badge.live{background:var(--live);color:#fff;border-color:var(--live);font-weight:700}
.badge.cat.Primera{color:var(--live);border-color:rgba(255,45,85,.3);background:rgba(255,45,85,.1)}
.badge.cat.Internacional{color:var(--accent);border-color:rgba(0,169,224,.3);background:rgba(0,169,224,.12)}
.convert{font-size:10px;color:var(--muted);margin-top:4px;font-family:ui-monospace,monospace}
.shift{font-size:9px;font-weight:800;padding:1px 5px;border-radius:999px;color:#fff;margin-left:4px}
.shift.pos{background:var(--success)} .shift.neg{background:var(--live)}
.now-line{position:absolute;left:0;right:0;height:2px;background:var(--live);z-index:15;pointer-events:none}
.now-line::before{content:'AHORA';position:absolute;left:-2px;top:-16px;background:var(--live);color:#fff;font-size:9px;font-weight:800;padding:2px 6px;border-radius:4px}
.empty{padding:40px;text-align:center;color:var(--muted)}
@media(max-width:800px){.epg{grid-template-columns:60px 1fr}.ch-col:nth-child(3){display:none}.search{width:100%}}
</style>
</head>
<body>
<div class="header">
  <div class="wrap top">
    <div class="brand"><span>【entity-TIGO SPORTS¦canonical_name=TIGO SPORTS】</span> PARAGUAY <span id="count" style="font-weight:400;font-size:11px;color:var(--muted);margin-left:8px"></span></div>
    <div class="controls">
      <input id="search" class="search" placeholder="Buscar: Cerro, Olimpia...">
      <label style="font-size:11px;color:var(--muted)"><input type="checkbox" id="dual" checked> JST+fecha</label>
      <select id="tz">
        <option value="America/Asuncion">PYT UTC-3</option>
        <option value="UTC">GMT/UTC</option>
        <option value="Asia/Tokyo" selected>JST Tokyo UTC+9</option>
        <option value="America/Argentina/Buenos_Aires">ART</option>
        <option value="America/New_York">EST</option>
      </select>
    </div>
  </div>
</div>

<div id="tabs" class="tabs"></div>

<div id="epg" class="epg">
  <div class="time-col" id="timeCol"></div>
  <div class="ch-col" id="ch1"><div class="ch-header"><span>【entity-Tigo Sports¦canonical_name=TIGO SPORTS】</span><span id="ch1count" style="font-weight:400;font-size:10px;color:var(--muted)"></span></div></div>
  <div class="ch-col" id="ch2"><div class="ch-header"><span>【entity-Tigo Sports¦canonical_name=TIGO SPORTS】 +</span><span id="ch2count" style="font-weight:400;font-size:10px;color:var(--muted)"></span></div></div>
</div>

<script>
const SOURCE_TZ='America/Asuncion';
function cleanText(s){
  if(!s) return '';
  return s.replace(/【entity-.*?¦canonical_name=(.*?)】/g,'$1').replace(/【.*?】/g,'').replace(/^\s*Tigo Sports\s*\+?\s*/i,'').trim();
}
function getOffsetMinutes(tz,date){
  try{
    const fmt=new Intl.DateTimeFormat('en-US',{timeZone:tz,timeZoneName:'shortOffset',hour:'2-digit'});
    const name=fmt.formatToParts(date).find(p=>p.type==='timeZoneName')?.value||'GMT+0';
    const m=name.match(/GMT([+-])(\d+)(?::(\d+))?/);
    if(!m) return 0;
    return (m[1]==='+'?1:-1)*(parseInt(m[2])*60+parseInt(m[3]||'0'));
  }catch{return 0}
}
function convertWithDate(hora_pyt,fecha_pyt,targetTZ){
  const [y,m,d]=fecha_pyt.split('-').map(Number);
  const [h,min]=hora_pyt.split(':').map(Number);
  const baseUTC=Date.UTC(y,m-1,d,h,min);
  const srcOff=getOffsetMinutes(SOURCE_TZ,new Date(baseUTC));
  const tgtOff=getOffsetMinutes(targetTZ,new Date(baseUTC));
  const diff=tgtOff-srcOff;
  let total=h*60+min+diff;
  let cur=new Date(y,m-1,d);
  let shift=0;
  while(total<0){total+=1440;cur.setDate(cur.getDate()-1);shift--;}
  while(total>=1440){total-=1440;cur.setDate(cur.getDate()+1);shift++;}
  const dateStr=`${cur.getFullYear()}-${String(cur.getMonth()+1).padStart(2,'0')}-${String(cur.getDate()).padStart(2,'0')}`;
  const timeStr=`${String(Math.floor(total/60)).padStart(2,'0')}:${String(total%60).padStart(2,'0')}`;
  return{fechaOriginal:fecha_pyt,horaOriginal:hora_pyt,fechaConvertida:dateStr,horaConvertida:timeStr,dayShift:shift,label:shift===0?'':shift>0?`(+${shift}d)`:`(${shift}d)`};
}

let allData=null,currentDate=null;
function buildTimeCol(){
  const el=document.getElementById('timeCol');
  let html='<div class="ch-header" style="position:sticky;top:0">Hora PYT</div>';
  for(let h=6;h<=26;h++){
    const rh=h%24;
    const label=`${String(rh).padStart(2,'0')}:00`;
    html+=`<div class="time-slot" style="height:60px">${label}</div>`;
  }
  el.innerHTML=html;
}

async function loadAll(){
  buildTimeCol();
  const r=await fetch('./programacion.json?v='+Date.now());
  if(!r.ok){ document.getElementById('epg').innerHTML='<div class="empty">No se pudo cargar programacion.json - ejecuta el scraper</div>'; return; }
  allData=await r.json();
  // デモ除去: 空配列でもそのまま表示、サンプルを入れない
  const urlDate=new URLSearchParams(location.search).get('date');
  currentDate=urlDate&&allData.fechas_disponibles.includes(urlDate)?urlDate:allData.fechas_disponibles[0];
  renderTabs(); renderEPG();
}
function renderTabs(){
  document.getElementById('tabs').innerHTML=allData.fechas_disponibles.map(f=>{
    const d=new Date(f+'T12:00:00');
    const label=d.toLocaleDateString('es-PY',{weekday:'short',day:'2-digit',month:'short'});
    const isToday=f===allData.fechas_disponibles[0];
    return `<button class="tab ${f===currentDate?'active':''}" onclick="switchDate('${f}')">${label} ${isToday?'<span class="hoy">Hoy</span>':''}</button>`;
  }).join('');
}
function switchDate(f){currentDate=f;history.replaceState(null,'',`?date=${f}`);renderTabs();renderEPG();}

function calcDuration(curr,next){
  const [h1,m1]=curr.hora_pyt.split(':').map(Number);
  let start=h1*60+m1;
  if(!next) return 60;
  const [h2,m2]=next.hora_pyt.split(':').map(Number);
  let end=h2*60+m2;
  if(end<=start) end+=1440;
  let dur=end-start;
  if(dur<20) dur=30;
  if(dur>180) dur=120;
  return dur;
}

function renderEPG(){
  const tz=document.getElementById('tz').value;
  const dual=document.getElementById('dual').checked;
  const q=document.getElementById('search').value.toLowerCase();
  const day=allData.programacion_por_fecha[currentDate];
  let list=day?day.programacion:[];
  // タグ除去
  list=list.map(p=>({...p,titulo:cleanText(p.titulo),canal:cleanText(p.canal)||p.canal}));
  if(q) list=list.filter(p=>(p.titulo+' '+p.canal+' '+p.categoria).toLowerCase().includes(q));
  
  const ch1=list.filter(p=>!p.canal.includes('+'));
  const ch2=list.filter(p=>p.canal.includes('+'));
  
  document.getElementById('count').textContent=`${list.length} programas - ${currentDate}`;
  document.getElementById('ch1count').textContent=`${ch1.length}`;
  document.getElementById('ch2count').textContent=`${ch2.length}`;
  
  function renderChannel(elId, programs){
    const el=document.getElementById(elId);
    // ヘッダー以外削除
    [...el.querySelectorAll('.program,.now-line,.empty')].forEach(n=>n.remove());
    if(programs.length===0){
      el.innerHTML+=`<div class="empty" style="margin-top:80px">Sin datos reales<br><span style="font-size:10px">El scraper no encontró programas para este día</span></div>`;
      return;
    }
    programs.forEach((p,i)=>{
      const next=programs[i+1];
      const dur=calcDuration(p,next);
      const [h,m]=p.hora_pyt.split(':').map(Number);
      let minutesFrom6 = (h*60+m) - 6*60;
      if(h<6) minutesFrom6 += 24*60 - 6*60;
      const top = 38 + minutesFrom6; // 38 = header height
      const height = dur - 6;
      const conv=convertWithDate(p.hora_pyt,currentDate,tz);
      const catClass = p.categoria.includes('Primera')?'Primera':p.categoria.includes('Internacional')||p.categoria.includes('Libertadores')?'Internacional':'';
      
      const div=document.createElement('div');
      div.className=`program ${p.en_vivo?'live':''}`;
      div.style.top=top+'px';
      div.style.height=height+'px';
      div.innerHTML=`
        <div class="hora">${p.hora_pyt} ${p.en_vivo?'<span class="badge live">● VIVO</span>':''}</div>
        <div class="titulo">${p.titulo}</div>
        <div class="meta">
          <span class="badge cat ${catClass}">${p.categoria}</span>
          <span class="badge">${p.canal}</span>
        </div>
        ${dual&&tz!=='America/Asuncion'?`<div class="convert">→ ${tz}: ${conv.fechaConvertida} ${conv.horaConvertida} ${conv.dayShift!==0?`<span class="shift ${conv.dayShift>0?'pos':'neg'}">${conv.label}</span>`:''}</div>`:''}
      `;
      el.appendChild(div);
    });
    // 現在時刻ライン
    if(currentDate===allData.fechas_disponibles[0]){
      const now=new Date();
      const nowMin=now.getHours()*60+now.getMinutes() - 6*60;
      if(nowMin>=0){
        const line=document.createElement('div');
        line.className='now-line';
        line.style.top=(38+nowMin)+'px';
        el.appendChild(line);
      }
    }
  }
  
  renderChannel('ch1', ch1);
  renderChannel('ch2', ch2);
}

document.getElementById('tz').addEventListener('change',renderEPG);
document.getElementById('dual').addEventListener('change',renderEPG);
document.getElementById('search').addEventListener('input',renderEPG);
loadAll();
</script>
</body>
</html>
