name: AI EPG - qwen2 0.5b (lightest)
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          sleep 3

      - name: Pull qwen2:0.5b (350MB - 超軽量・高性能)
        run: |
          ollama pull qwen2:0.5b

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - run: pip install requests

      - name: Generate EPG (2 days ago to 7 days)
        run: python scripts/ai_generator_local.py

      - name: Commit to Pages
        run: |
          git config user.name "ai-bot"
          git config user.email "ai-bot@github"
          git add docs/
          git diff --staged --quiet || git commit -m "AI EPG qwen2:0.5b $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git pull --rebase origin main || true
          git push origin main
