name: Update Tigo Guide

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      # pipのバージョンチェック自体を無効化（upgradeを促すメッセージを出さない）
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      # pipのアップグレードを禁止
      PIP_NO_WARN_SCRIPT_LOCATION: "1"
    steps:
      - uses: actions/checkout@v5

      - name: Setup Python (pip upgradeなし)
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt
          # ※ pipのアップグレードは行わない

      - name: Install deps without pip upgrade
        run: |
          # python -m pip のバージョンはそのまま、--upgrade pip は絶対に実行しない
          pip install --no-input -q -r requirements.txt
          playwright install chromium --with-deps

      - name: Download sources
        run: python scripts/download.py

      - name: Parse
        run: python scripts/scrape.py

      - name: Commit
        run: |
          git config user.name "bot"
          git config user.email "bot@github"
          git add docs/raw/ docs/data.json
          git diff --staged --quiet || (git commit -m "update schedule" && git push)
