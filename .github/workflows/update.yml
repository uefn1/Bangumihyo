name: Update Tigo Guide

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  update:
    # ubuntu-latestの移行警告を避けるため明示的に固定
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # v4 -> v5 で Node.js 24対応
      - uses: actions/checkout@v5

      # v5 -> v6 で Node.js 24対応
      - name: Setup Python with cache
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          # ↓ ここで明示的にパスを指定すると「No file matched」エラーが消える
          cache-dependency-path: |
            requirements.txt
            **/requirements.txt

      - name: Install deps
        run: pip install -q -r requirements.txt

      - name: Scrape
        run: python scripts/scrape.py

      - name: Commit
        run: |
          git config user.name "bot"
          git config user.email "bot@github"
          git add docs/data.json
          git diff --staged --quiet || (git commit -m "update schedule" && git push)
