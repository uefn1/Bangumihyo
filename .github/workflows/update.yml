name: Actualizar Programación Tigo Sports

on:
  schedule:
    - cron: '0 * * * *' # 毎時0分、パラグアイ時間で毎時実行
  workflow_dispatch: # 手動実行も可能
  push:
    branches: [main]

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - run: pip install -r requirements.txt

      - run: python scripts/scraper.py

      - name: Commit si hay cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/programacion.json
          git diff --staged --quiet || (git commit -m "chore: actualizar programacion $(date -u +%Y-%m-%dT%H:%M:00Z)" && git push)
