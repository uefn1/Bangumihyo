name: AI EPG - Tiny Model
on:
  schedule: [{cron: '0 * * * *'}]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          sleep 3

      - name: Pull tiny model (450MB - 最軽量)
        run: |
          ollama pull tinyllama
          # 代替: ollama pull qwen2:0.5b  (さらに軽い 350MB)
          # 代替: ollama pull llama3.2:1b  (1.3GBだが高性能)

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - run: pip install requests

      - name: Generate EPG with tiny model
        run: python scripts/ai_generator_local.py

      - name: Commit
        run: |
          git config user.name "ai-bot"
          git config user.email "ai-bot@github"
          git add docs/
          git diff --staged --quiet || git commit -m "AI EPG tinyllama $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git pull --rebase origin main || true
          git push origin main
