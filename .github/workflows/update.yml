name: Actualizar Programación Tigo Sports

concurrency:
  group: tigo-pages
  cancel-in-progress: false

on:
  schedule:
    - cron: '0 * * * *'  # 毎時0分に実行 (UTC)
  workflow_dispatch:     # 手動実行ボタン
  push:
    branches: [main]

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          mkdir -p docs/data

      - name: Run scraper (multi-date + GMT)
        run: python scripts/scraper.py

      - name: Commit y push con rebase
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add docs/programacion.json docs/data/
          
          if git diff --staged --quiet; then
            echo "No hay cambios para commitear"
            exit 0
          fi
          
          git commit -m "chore: actualizar programacion $(date -u +%Y-%m-%dT%H:%M:00Z)"
          
          # non-fast-forward エラー対策: リモートを取り込んでからpush
          echo "Haciendo pull --rebase..."
          git pull --rebase origin main || {
            echo "Rebase conflict, aborting and trying merge strategy"
            git rebase --abort
            git pull origin main --no-rebase
          }
          
          git push origin main

      - name: Summary
        run: |
          echo "### ✅ Actualización completada" >> $GITHUB_STEP_SUMMARY
          echo "- Fecha: $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "- Archivos: $(ls docs/data/*.json | wc -l) dias" >> $GITHUB_STEP_SUMMARY
          cat docs/data/index.json >> $GITHUB_STEP_SUMMARY
