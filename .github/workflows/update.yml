name: Update Tigo Guide

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - run: |
          pip install -q -r requirements.txt
          playwright install chromium --with-deps

      - name: Download sources (save raw html)
        run: python scripts/download.py

      - name: Parse from downloaded files
        run: python scripts/scrape.py

      - name: Commit raw + json
        run: |
          git config user.name "bot"
          git config user.email "bot@github"
          git add docs/raw/ docs/data.json
          git diff --staged --quiet || (git commit -m "update raw and schedule" && git push)
